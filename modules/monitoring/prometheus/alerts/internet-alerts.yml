groups:
  - name: Internet Connectivity
    rules:
      # Alert: Internet onbruikbaar — huisgenoten gaan klagen
      # Vereist 2 opeenvolgende slechte metingen (~60 min) om ruis te filteren
      - alert: InternetKapot
        expr: min_over_time(homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_download"}[65m]) < 25
        for: 5m
        labels:
          severity: critical
          component: internet
          service: speedtest
        annotations:
          summary: "Internet onbruikbaar (< 25 Mbit/s download)"
          description: "Download snelheid is al ~60 min onder 25 Mbit/s (nu {{ $value | humanize }} Mbit/s). Glasvezel 200 contract."

      # Alert: Internet significant onder contract — bewijs voor ISP-klacht
      - alert: InternetMatig
        expr: min_over_time(homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_download"}[65m]) < 80
        for: 5m
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Internet significant onder contract (< 80 Mbit/s download)"
          description: "Download snelheid is al ~60 min onder 80 Mbit/s (nu {{ $value | humanize }} Mbit/s, < 40% van 200 Mbit/s contract)."

      # Alert: Upload onbruikbaar — videobellen/Teams onmogelijk
      - alert: UploadKapot
        expr: min_over_time(homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_upload"}[65m]) < 10
        for: 5m
        labels:
          severity: critical
          component: internet
          service: speedtest
        annotations:
          summary: "Upload onbruikbaar (< 10 Mbit/s)"
          description: "Upload snelheid is al ~60 min onder 10 Mbit/s (nu {{ $value | humanize }} Mbit/s). Videobellen niet mogelijk."

      # Alert: Speedtest niet recent uitgevoerd
      - alert: SpeedtestStale
        expr: (time() - homeassistant_last_updated_time_seconds{entity="sensor.speedtest_download"}) > 86400
        for: 1h
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Speedtest data verouderd"
          description: "Laatste speedtest is {{ $value | humanizeDuration }} geleden. Speedtest add-on mogelijk niet actief."
