groups:
  - name: Internet Connectivity
    rules:
      # Alert: Download speed kritiek laag
      - alert: InternetDownloadSpeedCritical
        expr: homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_download"} < 20
        for: 5m
        labels:
          severity: critical
          component: internet
          service: speedtest
        annotations:
          summary: "Download snelheid kritiek laag"
          description: "Download snelheid is {{ $value | humanize }} Mbps (onder 20 Mbps threshold). Normaal verwacht: >35 Mbps."

      # Alert: Download speed laag
      - alert: InternetDownloadSpeedLow
        expr: homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_download"} < 35 and homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_download"} >= 20
        for: 15m
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Download snelheid ondermaats"
          description: "Download snelheid is {{ $value | humanize }} Mbps (onder 35 Mbps optimaal). Normaal verwacht: >35 Mbps."

      # Alert: Upload speed kritiek laag
      - alert: InternetUploadSpeedCritical
        expr: homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_upload"} < 4
        for: 5m
        labels:
          severity: critical
          component: internet
          service: speedtest
        annotations:
          summary: "Upload snelheid kritiek laag"
          description: "Upload snelheid is {{ $value | humanize }} Mbps (onder 4 Mbps threshold). Normaal verwacht: >7 Mbps."

      # Alert: Upload speed laag
      - alert: InternetUploadSpeedLow
        expr: homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_upload"} < 7 and homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_upload"} >= 4
        for: 15m
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Upload snelheid ondermaats"
          description: "Upload snelheid is {{ $value | humanize }} Mbps (onder 7 Mbps optimaal). Normaal verwacht: >7 Mbps."

      # Alert: Hoge latency
      - alert: InternetLatencyHigh
        expr: homeassistant_sensor_duration_ms{entity="sensor.speedtest_ping"} > 50
        for: 10m
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Hoge internet latency"
          description: "Ping latency is {{ $value | humanize }} ms (boven 50ms threshold). Optimaal: <15ms."

      # Alert: Zeer hoge latency
      - alert: InternetLatencyCritical
        expr: homeassistant_sensor_duration_ms{entity="sensor.speedtest_ping"} > 100
        for: 5m
        labels:
          severity: critical
          component: internet
          service: speedtest
        annotations:
          summary: "Zeer hoge internet latency"
          description: "Ping latency is {{ $value | humanize }} ms (boven 100ms critical threshold)."

      # Alert: Speed degradation - download
      - alert: InternetDownloadDegradation
        expr: (homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_download"} / avg_over_time(homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_download"}[7d])) * 100 < 70
        for: 30m
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Download snelheid gedegradeerd t.o.v. gemiddelde"
          description: "Download snelheid is {{ $value | humanize }}% van 7-dagen gemiddelde (onder 70% threshold). Mogelijk netwerk probleem."

      # Alert: Speed degradation - upload
      - alert: InternetUploadDegradation
        expr: (homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_upload"} / avg_over_time(homeassistant_sensor_data_rate_mbit_per_s{entity="sensor.speedtest_upload"}[7d])) * 100 < 70
        for: 30m
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Upload snelheid gedegradeerd t.o.v. gemiddelde"
          description: "Upload snelheid is {{ $value | humanize }}% van 7-dagen gemiddelde (onder 70% threshold). Mogelijk netwerk probleem."

      # Alert: Speedtest niet recent uitgevoerd
      - alert: SpeedtestStale
        expr: (time() - homeassistant_last_updated_time_seconds{entity="sensor.speedtest_download"}) > 86400
        for: 1h
        labels:
          severity: warning
          component: internet
          service: speedtest
        annotations:
          summary: "Speedtest data verouderd"
          description: "Laatste speedtest is {{ $value | humanizeDuration }} geleden. Speedtest add-on mogelijk niet actief."
