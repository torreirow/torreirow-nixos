groups:
  - name: Waze
    rules:
      # Alert: Waze sensor unavailable
      - alert: WazeSensorUnavailable
        expr: homeassistant_entity_available{entity=~"sensor.waze_.*|sensor.wto.*"} == 0
        for: 30m
        labels:
          severity: warning
          component: mobile
          service: waze
        annotations:
          summary: "Waze sensor niet beschikbaar: {{ $labels.friendly_name }}"
          description: "Waze sensor '{{ $labels.friendly_name }}' ({{ $labels.entity }}) is al 30 minuten niet beschikbaar."
