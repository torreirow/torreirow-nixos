<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}">
  {{ block "head" . }}{{ end }}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ "/" | relURL }}">📓 {{ site.Title }}</a>
    <div id="topsearch" class="topsearch"></div>
    <nav class="browse">
      {{ range slice "customer" "project" "type" "doctype" "tag" }}
        {{ $tax := index site.Taxonomies . }}
        {{ if $tax }}<a href="{{ (printf "/%s/" .) | relURL }}">{{ . | title }}</a>{{ end }}
      {{ end }}
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer class="foot">Torrlinny · statisch gebouwd · {{ now.Format "2006-01-02 15:04" }}</footer>

  <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new PagefindUI({
        element: "#topsearch",
        showImages: false,
        showSubResults: true,
        pageSize: 8,
        sort: { date: "desc" },
        translations: {
          placeholder: "Zoeken…",
          zero_results: "Niets voor \"[SEARCH_TERM]\"",
        },
      });
    });
  </script>
</body>
</html>
