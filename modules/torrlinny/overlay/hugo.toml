# Zelfstandige "overlay" Hugo-site voor torrlinny.
# Leest ALLEEN torrlinny's content/ in; hun eigen config/themes/submodules
# worden genegeerd (frontend = overlay, content-repo blijft ongemoeid).
baseURL = "https://linny.toorren.net/"
title = "Linny"
enableRobotsTXT = false
# .Lastmod = datum van de laatste git-commit die het bestand raakte (echte
# "laatst gewijzigd"). Vereist een NIET-shallow clone + .git in de build-root.
enableGitInfo = true
disableKinds = ["RSS", "sitemap"]
summaryLength = 30

# crdate (torrlinny's datumveld) -> Hugo's .Date, zodat sorteren op datum werkt.
frontmatter.date = ["crdate", "date", "publishDate", "lastmod"]

# Facet-dimensies (matchen de frontmatter-velden in torrlinny).
[taxonomies]
  customer = "customer"
  project  = "project"
  type     = "type"
  tag      = "tag"
  owner    = "owner"
  subject  = "subject"
  doctype  = "doctype"

[markup.goldmark.renderer]
  unsafe = true            # notities bevatten rauwe links/HTML

[markup.goldmark.extensions]
  [markup.goldmark.extensions.typographer]
    disable = true

[markup.tableOfContents]
  startLevel = 2
  endLevel   = 3

[pagination]
  pagerSize = 5000         # geen server-side paginering; Pagefind/JS doet de rest
