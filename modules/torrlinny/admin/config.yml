# Sveltia CMS config voor de Torrlinny-notities.
# Auth: PAT-login (fine-grained GitHub token, Contents rw op torreirow/torrlinny).
# De token wordt in de browser geplakt (localStorage); staat NIET in git/nix.

backend:
  name: github
  repo: torreirow/torrlinny
  branch: main

site_url: https://linny.toorren.net

# Geen media/afbeeldingen-upload (non-goal).
media_folder: ""
public_folder: ""

collections:
  - name: notes
    label: Notities
    label_singular: Notitie
    # Non-recursieve folder-collectie: alleen de platte content/*.md (de notities).
    # De _index.md in submappen (customer/, project/, notes-by-*/ ...) vallen automatisch buiten beeld.
    folder: content
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: "{{title}}  ·  {{customer}}"
    sortable_fields: [title, crdate, customer]
    fields:
      - { name: title, label: Titel, widget: string, required: true }
      # crdate als string (behoudt de exacte YYYY-MM-DD; geen date-widget-herformattering).
      - { name: crdate, label: Aangemaakt, widget: string, required: false, hint: "YYYY-MM-DD" }
      - { name: customer, label: Customer, widget: string, required: false }
      - { name: doctype, label: Doctype, widget: string, required: false }
      - { name: type, label: Type, widget: string, required: false }
      - { name: project, label: Project, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: starred, label: Starred, widget: boolean, required: false, default: false }
      - { name: archive, label: Archive, widget: boolean, required: false, default: false }
      # Legacy-afwijkers expliciet declareren zodat Sveltia ze bij opslaan NIET stript
      # (zolang de eenmalige normalisatie taak 1 nog niet gedaan is).
      - { name: tag, label: "tag (legacy)", widget: string, required: false }
      - { name: tbv, label: "tbv (legacy)", widget: string, required: false }
      - { name: owner, label: "owner (legacy)", widget: string, required: false }
      - { name: body, label: Inhoud, widget: markdown }
