<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestanden uploaden</title>
<style>
  :root { --fg: #141414; --muted: #5b564f; --bg: #f7f5f2; --card: #fff; --line: #ddd8d0;
          --accent: #2563eb; --ok: #15803d; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f0ea; --muted: #bdb6ab; --bg: #141414; --card: #1f1e1c; --line: #3a3733;
            --accent: #60a5fa; --ok: #4ade80; --err: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 3rem auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.lead { color: var(--muted); margin: 0 0 1.5rem; }
  label { display: block; font-weight: 600; margin: 1rem 0 .3rem; }
  input[type=text], input[type=email] { width: 100%; padding: .6rem .7rem; font: inherit; color: inherit;
         background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  input[type=file] { width: 100%; font: inherit; }
  .hint { color: var(--muted); font-size: .9rem; margin-top: .3rem; }
  .hp { position: absolute; left: -9999px; }
  cap-widget { display: block; margin-top: 1.25rem; }
  button { margin-top: 1.25rem; width: 100%; padding: .75rem; font: inherit; font-weight: 700; color: #fff;
           background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; margin-top: 1rem; display: none; }
  #status { margin-top: 1rem; min-height: 1.5em; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Upload je bestanden naar EGH Scherm Team</h1>
    <p class="lead">Je bestanden komen direct bij ons binnen. Je ziet geen bestanden van anderen.</p>
    <form id="form" action="/upload" method="post" enctype="multipart/form-data">
      <!-- Text fields stay before the file input: the server validates them before storing files. -->
      <label for="naam">Naam</label>
      <input type="text" id="naam" name="naam" required maxlength="100" autocomplete="name">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" required maxlength="200" autocomplete="email">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <cap-widget id="cap" data-cap-api-endpoint="{{CAP_ENDPOINT}}"></cap-widget>
      <label for="files">Bestanden</label>
      <input type="file" id="files" name="files" multiple required>
      <div class="hint">Maximaal {{MAX_MB}} MB per keer.</div>
      <button type="submit" id="submit">Uploaden</button>
      <progress id="progress" max="100" value="0"></progress>
      <div id="status" role="status"></div>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@cap.js/widget@0.1.58" defer></script>
<script>
  const form = document.getElementById("form");
  const button = document.getElementById("submit");
  const progress = document.getElementById("progress");
  const status = document.getElementById("status");
  const maxBytes = {{MAX_MB}} * 1024 * 1024;

  function show(msg, cls) { status.textContent = msg; status.className = cls || ""; }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const data = new FormData(form);
    if (!data.get("cap-token")) { show("Bevestig eerst de captcha.", "err"); return; }
    const total = [...document.getElementById("files").files].reduce((s, f) => s + f.size, 0);
    if (total > maxBytes) { show("De bestanden zijn samen groter dan {{MAX_MB}} MB.", "err"); return; }

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/upload");
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) progress.value = Math.round(ev.loaded / ev.total * 100);
    };
    xhr.onload = () => {
      let res = {};
      try { res = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status === 200 && res.ok) {
        show(res.message, "ok");
        form.reset();
      } else {
        show(res.message || "Uploaden mislukt (HTTP " + xhr.status + ").", "err");
      }
      done();
    };
    xhr.onerror = () => { show("Verbinding verbroken. Probeer het opnieuw.", "err"); done(); };
    button.disabled = true;
    progress.value = 0;
    progress.style.display = "block";
    show("Bezig met uploaden…");
    xhr.send(data);
  });

  // A Cap token is single-use: reset the widget after every attempt.
  function done() {
    button.disabled = false;
    progress.style.display = "none";
    const cap = document.getElementById("cap");
    if (cap && cap.reset) cap.reset();
  }
</script>
</body>
</html>
