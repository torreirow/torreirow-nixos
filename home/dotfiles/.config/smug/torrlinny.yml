session: Site TorrLinny
startup_pane: 1

# Local web view of the notebook (linny-web-theme), next to the TorrLinny session
# from notepad.yml. git-sync and the linny.vim indexer run there, not here.
root: ~/data/git/torreirow/torrlinny

stop:

windows:
  - name: web
    layout: main-horizontal
    commands:
      - ./start-web.sh
  - name: cmd
    layout: main-horizontal
